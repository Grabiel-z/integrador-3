name: ta4
x-app: &app
  image: ta4-python:1.0
  build:
    context: .
    dockerfile: sunat/Dockerfile
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /app
  init: true
  environment: &appenv
    TZ: America/Lima
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    HOME: /tmp
  volumes:
    - ./:/app
  networks: [backend, egress]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    environment:
      TZ: America/Lima
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NO_CLOUD: "1"
    volumes: [ollama_data:/root/.ollama]
    networks: [backend, egress]
    mem_limit: 7g
    cpus: 6
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  model-init:
    <<: *app
    command: [python, -m, tools.init_model]
    restart: on-failure:2
    environment:
      <<: *appenv
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: gemma4:e2b-it-q4_K_M
    volumes:
      - ./:/app:ro
      - ollama_data:/model-store:ro
      - ./evidencias:/app/evidencias
    depends_on:
      ollama: {condition: service_healthy}
  ai-gateway:
    <<: *app
    command: [uvicorn, gateway.app:app, --host, 0.0.0.0, --port, "8000", --workers, "1"]
    restart: unless-stopped
    environment:
      <<: *appenv
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: gemma4:e2b-it-q4_K_M
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-2048}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-192}
    volumes: [./:/app:ro]
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    restart: unless-stopped
    ports: ["127.0.0.1:${N8N_PORT:-5678}:5678"]
    environment: &n8nenv
      TZ: America/Lima
      GENERIC_TIMEZONE: America/Lima
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_PROXY_HOPS: "1"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_EXECUTION_DATA_MAX_AGE: "72"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "72"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./chatbot/workflows:/workflows:ro
    networks: [backend, egress]
    depends_on:
      ai-gateway: {condition: service_healthy}
      n8n-bootstrap: {condition: service_completed_successfully}
    mem_limit: 1g
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    logging: *logging
  n8n-bootstrap:
    image: docker.n8n.io/n8nio/n8n:2.45.7
    entrypoint: [/bin/sh, /bootstrap/import.sh]
    environment: *n8nenv
    volumes:
      - n8n_data:/home/node/.n8n
      - ./chatbot/workflows:/workflows:ro
      - ./infra/import.sh:/bootstrap/import.sh:ro
    networks: [backend]
  sunat-worker:
    <<: *app
    profiles: [tasks]
    command: [python, -m, sunat.main]
    shm_size: 1gb
  sunat-api:
    <<: *app
    command: [uvicorn, sunat.api:app, --host, 0.0.0.0, --port, "8001", --workers, "1"]
    restart: unless-stopped
    volumes: [./:/app:ro]
    mem_limit: 256m
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging
  test-runner:
    <<: *app
    profiles: [tasks]
    command: [pytest, -q, --junitxml=evidencias/tests_unitarios.xml]
  report-builder:
    <<: *app
    profiles: [tasks]
    command: [python, -m, tools.build_report]
  webhook-proxy:
    image: nginx:1.28.0-alpine
    profiles: [telegram]
    volumes: [./infra/webhook.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [backend]
    depends_on: [n8n]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [telegram]
    command: [tunnel, --no-autoupdate, --url, http://webhook-proxy:8080]
    networks: [backend, egress]
    depends_on: [webhook-proxy]
    restart: unless-stopped
networks:
  backend: {internal: true}
  egress: {}
volumes:
  ollama_data: {}
  n8n_data: {}
